name: Deploy to Hugging Face Space

# Pushes main to a Docker Space. Set repository secret HF_TOKEN (write token) and
# repository variable HF_SPACE (e.g. Maggiee18/pitchmirror). Skipped when they are not set.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Spaces reject plain binary files, and the Space needs its own README header.
          # Sample decks are regenerated inside the Docker build instead.
          rm -f samples/*.pdf samples/*.pptx
          cp deploy/huggingface/README.md README.md
          rm -rf .git
          git init -q -b main
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
