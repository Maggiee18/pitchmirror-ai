name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt pytest matplotlib
      - name: Unit, integration and provider tests
        working-directory: backend
        env:
          LLM_PROVIDER: offline
        run: python -m pytest -q
      - name: Evaluation benchmark
        env:
          LLM_PROVIDER: offline
        run: |
          python scripts/evaluate.py
          cat docs/evaluation.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke test
        run: |
          docker build -t pitchmirror .
          docker run -d -p 7860:7860 --name pm pitchmirror
          for i in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 2; done
          curl -sf localhost:7860/api/health | grep '"ok":true'
          curl -sf -X POST -F mode=viva localhost:7860/api/samples/crowdsense_viva_demo.pdf | grep '"slides"'
